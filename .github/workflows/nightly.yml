name: Nightly link check

on:
    schedule:
        - cron: "17 9 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    links:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v6

            - name: Enable Corepack
              run: corepack enable

            - name: Set up Node 24
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  cache: yarn

            - name: Install dependencies and build
              run: yarn install --immutable && yarn build

            - name: Check links on allons-y.studio
              run: node dist/cli.js --reporter github --reporter console
